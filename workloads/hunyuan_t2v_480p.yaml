# Canonical HunyuanVideo text-to-video workload. Hunyuan uses embedded CFG
# (guidance_scale 6.0 matches the pipeline default embedded_cfg_scale) and a
# LLaMA + CLIP dual text encoder; 480p keeps nightly GPU budgets practical.
schema_version: 1
workload_id: hunyuan-t2v-480p
description: >
  Representative HunyuanVideo T2V workload for discovery-only nightly
  campaigns. Step count is CI-scale; raise sampling.num_inference_steps to
  50 for production ranking.
model:
  model_id: hunyuanvideo-community/HunyuanVideo
task: t2v
prompt: >
  A curious raccoon peers through a vibrant field of yellow sunflowers, soft
  natural light, steady cinematic camera.
sampling:
  height: 480
  width: 832
  num_frames: 49
  num_inference_steps: 4
  guidance_scale: 6.0
  seed: 1024
  dtype: bfloat16
runtime:
  num_gpus: 1
  use_fsdp_inference: false
  dit_cpu_offload: false
  vae_cpu_offload: false
  text_encoder_cpu_offload: true
  pin_cpu_memory: false
measurement:
  warmups: 1
  runs: 2
  save_frames: true
  save_video: false
parity:
  policy: byte_equal
performance:
  min_end_to_end_speedup: 1.01
  max_peak_memory_regression: 0.05
tags:
  - hunyuan
  - t2v
  - 480p
  - nightly
