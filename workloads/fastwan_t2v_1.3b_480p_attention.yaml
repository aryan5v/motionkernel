# FastWan with Video Sparse Attention as the candidate -- VSA's intended regime.
#
# Round 1 rejected VSA at 0.5169x, but that was zero-shot on vanilla Wan.
# FastVideo's VSA results come from FastWan checkpoints, so vanilla Wan was the
# wrong host for it. This workload puts VSA where it is meant to run.
#
# Caveat recorded up front: FastWan is DMD-distilled to 3 denoising steps, so
# the transformer runs 3 times per generation instead of 20. Fixed per-generation
# costs (text encoding, VAE decode) therefore take a much larger share of
# end-to-end, which lowers the Amdahl ceiling for ANY attention backend. The
# attention share must be measured here before this result is interpreted.
#
# Canonical FastWan 2.1 1.3B text-to-video workload. FastWan is DMD-distilled
# (3 denoising steps, guidance 1.0), the family's low-latency variant; short
# denoising makes per-call dispatch overhead proportionally more visible.
schema_version: 1
workload_id: fastwan-t2v-1.3b-480p-attention
description: >
  Representative FastWan 2.1 1.3B T2V workload for discovery-only nightly
  campaigns. DMD distillation fixes the denoising schedule at 3 steps.
model:
  model_id: FastVideo/FastWan2.1-T2V-1.3B-Diffusers
task: t2v
prompt: >
  A curious raccoon peers through a vibrant field of yellow sunflowers, soft
  natural light, steady cinematic camera.
sampling:
  height: 480
  width: 832
  num_frames: 49
  num_inference_steps: 3
  guidance_scale: 1.0
  seed: 1024
  dtype: bfloat16
runtime:
  num_gpus: 1
  use_fsdp_inference: false
  dit_cpu_offload: false
  vae_cpu_offload: false
  text_encoder_cpu_offload: true
  pin_cpu_memory: false
measurement:
  # 15 timed runs per arm: this is a gating measurement, not discovery.
  # The parent FastWan manifest uses runs: 2 because it feeds nightly
  # discovery, and inheriting that here would produce a number the variance
  # ceiling should refuse.
  warmups: 1
  runs: 15
  save_frames: true
  save_video: false


parity:
  policy: byte_equal
fidelity:
  # Tier 2. VSA skips attention blocks, so it cannot be bitwise exact and would
  # be rejected under tier 1 before being benchmarked.
  tier: perceptual
  min_ssim: 0.97
  max_lpips: 0.05
  frame_set: fastwan-t2v-1.3b-480p-seed1024
  seed: 1024
performance:
  min_end_to_end_speedup: 1.3
  max_peak_memory_regression: 0.05
mode_env:
  native:
    FASTVIDEO_ATTENTION_BACKEND: FLASH_ATTN
  optimized:
    FASTVIDEO_ATTENTION_BACKEND: VIDEO_SPARSE_ATTN
tags:
  - fastwan
  - t2v
  - 480p
  - nightly
