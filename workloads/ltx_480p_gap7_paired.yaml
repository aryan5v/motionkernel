# GAP 7: re-validate the promoted V1 LTX artifact under the paired protocol.
#
# The headline (1.0857x median, 1.2514x replication) was measured under the
# SEQUENTIAL protocol, which schema v3 established is ungateable on this
# cluster: the two arms sample different parts of the clock ramp and their
# median difference contains the drift. Three sequential runs of the SAME
# dispatch measurement reported 1.0274x, 1.2459x and 1.1155x.
#
# This re-runs the same artifact ABBA-interleaved so each pair is adjacent in
# time. Whatever it returns is the number: if it reproduces, the headline
# strengthens; if not, the retraction is published like the others.
# Canonical LTX text-to-video workload for the universal optimization agent.
# Uses a FastVideo-supported LTX-2 distilled checkpoint so discovery and
# end-to-end validation do not require LTX-specific fusion annotations.
schema_version: 1
workload_id: ltx-t2v-480p-gap7-paired
description: >
  Canonical LTX proof workload for MotionKernel's model-independent optimizer.
  Distilled checkpoint keeps overnight GPU budgets practical while still
  exercising a full FastVideo generation path.
model:
  model_id: FastVideo/LTX2-Distilled-Diffusers
task: t2v
prompt: >
  A red fox trots through fresh powder snow at golden hour, soft rim light,
  gentle camera pan following the animal, cinematic nature documentary style.
sampling:
  height: 480
  width: 768
  num_frames: 97
  num_inference_steps: 8
  guidance_scale: 1.0
  seed: 1024
  fps: 24
  dtype: bfloat16
runtime:
  num_gpus: 1
  use_fsdp_inference: false
  dit_cpu_offload: false
  vae_cpu_offload: false
  text_encoder_cpu_offload: true
  pin_cpu_memory: false
measurement:
  warmups: 1
  runs: 2
  save_frames: true
  save_video: false
parity:
  policy: byte_equal
performance:
  min_end_to_end_speedup: 1.01
  max_peak_memory_regression: 0.05
fidelity:
  # The V1 artifact is bit-exact by construction (CUDA-graph replay), so tier 1
  # is the right contract here -- unlike the attention candidates.
  tier: exact
mode_env:
  native: {}
  optimized:
    FASTVIDEO_OPTIMIZATION_ARTIFACT_DIR: /mnt/nfs/vlm-aryan/ltx-v1-r4-targeted-fix-20260801-203751/transformer-artifacts
    FASTVIDEO_OPTIMIZATION_ARTIFACT_MODEL_ID: FastVideo/LTX2-Distilled-Diffusers
    FASTVIDEO_OPTIMIZATION_ARTIFACT_VALIDATION: "1"
    FASTVIDEO_OPTIMIZATION_ARTIFACT_ENABLE: "1"
    # Fixed path so the runner can read candidate_calls back and assert the
    # artifact actually dispatched before any timing is interpreted.
    FASTVIDEO_OPTIMIZATION_ARTIFACT_DIAGNOSTICS: /mnt/nfs/vlm-aryan/gap7v2-dispatch.json
tags:
  - ltx
  - t2v
  - 480p
  - proof
