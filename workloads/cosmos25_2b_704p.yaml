# Canonical Cosmos Predict2.5 2B text-to-video optimization workload.
# Sampling dimensions match FastVideo's cosmos25_predict2_2b preset. This file
# defines a candidate workload; support is claimed only after all promotion
# gates pass on a recorded GPU environment.
schema_version: 1
workload_id: cosmos25-t2v-2b-704p
description: >
  Native-resolution Cosmos Predict2.5 2B workload for model-independent
  discovery, autonomous kernel search, and end-to-end validation.
model:
  model_id: KyleShao/Cosmos-Predict2.5-2B-Diffusers
task: t2v
prompt: >
  A robotic arm performs precision welding in a modern industrial workshop.
  Bright blue-white sparks illuminate drifting smoke while the camera makes a
  slow, steady lateral move, cinematic lighting, realistic motion and detail.
sampling:
  height: 704
  width: 1280
  num_frames: 77
  num_inference_steps: 35
  guidance_scale: 7.0
  seed: 0
  fps: 24
  dtype: bfloat16
runtime:
  num_gpus: 1
  use_fsdp_inference: false
  dit_cpu_offload: false
  vae_cpu_offload: false
  text_encoder_cpu_offload: false
  pin_cpu_memory: true
measurement:
  warmups: 1
  runs: 2
  save_frames: true
  save_video: false
parity:
  policy: byte_equal
performance:
  min_end_to_end_speedup: 1.01
  max_peak_memory_regression: 0.05
tags:
  - cosmos25
  - t2v
  - 2b
  - 704p
  - candidate
