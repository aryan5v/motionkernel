# Canonical Wan 2.1 14B text-to-video workload. Same generation contract as
# wan_t2v_1.3b_480p.yaml so the two sizes stay comparable; the 14B DiT is the
# family's primary search target (more blocks, higher per-call cost).
schema_version: 1
workload_id: wan-t2v-14b-480p
description: >
  Representative Wan 2.1 14B T2V workload for discovery-only nightly
  campaigns. Step count is CI-scale to keep nightly GPU budgets practical;
  raise sampling.num_inference_steps to 50 for production ranking.
model:
  model_id: Wan-AI/Wan2.1-T2V-14B-Diffusers
task: t2v
prompt: >
  A curious raccoon peers through a vibrant field of yellow sunflowers, soft
  natural light, steady cinematic camera.
sampling:
  height: 480
  width: 832
  num_frames: 49
  num_inference_steps: 4
  guidance_scale: 5.0
  seed: 1024
  dtype: bfloat16
runtime:
  num_gpus: 1
  use_fsdp_inference: false
  dit_cpu_offload: false
  vae_cpu_offload: false
  text_encoder_cpu_offload: true
  pin_cpu_memory: false
measurement:
  warmups: 1
  runs: 2
  save_frames: true
  save_video: false
parity:
  policy: byte_equal
performance:
  min_end_to_end_speedup: 1.01
  max_peak_memory_regression: 0.05
mode_env:
  native:
    FASTVIDEO_WAN_FUSIONS: "0"
  optimized:
    FASTVIDEO_WAN_FUSIONS: "1"
tags:
  - wan
  - 14b
  - t2v
  - 480p
  - nightly
